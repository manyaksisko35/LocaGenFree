name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka pytest

      - name: Run tests
        run: python -m pytest

      - name: Read version
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'CURRENT_VERSION = .v([0-9.]+)', open('locagenfree.py', encoding='utf-8').read()).group(1))"
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build
        run: >
          python -m nuitka --onefile --assume-yes-for-downloads --windows-console-mode=disable
          --enable-plugin=tk-inter --include-package-data=tkinterdnd2
          --windows-icon-from-ico=app_icon.ico --include-data-files=app_icon.ico=app_icon.ico
          --company-name="Hasan Alp Gungor" --product-name="LocaGen Free" --file-description="LocaGen Free"
          --file-version=${{ env.APP_VERSION }} --product-version=${{ env.APP_VERSION }}
          --output-dir=dist --output-filename=LocaGenFree.exe locagenfree.py

      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LocaGenFree.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Self test timed out" }
          Get-Content selftest.txt
          if (Select-String -Path selftest.txt -Pattern "^FAIL") { throw "Self test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LocaGenFree-exe
          path: dist/LocaGenFree.exe
          retention-days: 30
